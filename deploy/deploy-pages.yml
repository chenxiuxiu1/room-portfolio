# 暂存在 deploy/ 下：GitHub 只读 .github/workflows/ 里的工作流，
# 而当前使用的 fine-grained PAT 没有 workflow 权限，推不进去那个目录。
# 想改成 Actions 自动部署时：把本文件移到 .github/workflows/ 并删掉这段注释，
# 然后在 Settings → Pages 里把 Source 换成 “GitHub Actions”。
# 在那之前，站点由 gh-pages 分支提供（npm run build 后把 dist 推上去）。
name: 构建并发布到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# deploy-pages 需要 pages 写权限；id-token 是它内部的校验用的
permissions:
  contents: read
  pages: write
  id-token: write

# 同一分支连续推送时，只保留最后一次的部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # package-lock.json 在库里，用 ci 而不是 i，避免线上装出另一套版本
      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
