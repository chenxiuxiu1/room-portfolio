# 推 main 即自动发布：Actions 里 npm ci + npm run build，然后把 dist 覆盖到 gh-pages 分支。
# 为什么走分支而不是官方 deploy-pages action：这个仓库的 Pages 已经是“从 gh-pages 分支部署”，
# 而手上的 fine-grained PAT 没有 Pages 写权限、改不了 Source；分支方案只需要 contents:write。
name: 构建并发布到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: 把 dist 推到 gh-pages 分支
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA::8}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/gh-pages
