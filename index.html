<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#07080c" />
    <meta
      name="description"
      content="ROOM 01 —— 一间住在浏览器里的房间。等轴测 3D 空间个人主页。"

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2307080c'/><circle cx='16' cy='16' r='5.5' fill='%23ff8a5b'/></svg>"
    />

    <!-- 字体本地化：不依赖任何第三方域，首屏不再等待外链样式表。
         %BASE_URL% 由 Vite 填充，子路径部署到 GitHub Pages 时才不会读不到字体 -->
    <link
      rel="preload"
      href="%BASE_URL%fonts/space-grotesk-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%BASE_URL%fonts/jetbrains-mono-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: 'Space Grotesk';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url('%BASE_URL%fonts/space-grotesk-var.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 100 800;
        font-display: swap;
        src: url('%BASE_URL%fonts/jetbrains-mono-var.woff2') format('woff2-variations');
      }
      /* 中文一律使用系统字体，不下载任何中文字体文件 */
      html {
        background: #07080c;
      }
      body {
        margin: 0;
        background: #07080c;
      }
    </style>
  </head>

          也可以直接写信：<a href="mailto:hey@room01.dev" style="color: #ff8a5b">hey@room01.dev</a>
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
